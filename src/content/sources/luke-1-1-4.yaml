original_quote: "Since many have undertaken to set down an orderly account of the events that have been fulfilled among us, just as they were handed on to us by those who from the beginning were eyewitnesses and servants of the word, I too decided, after investigating everything carefully from the very first, to write an orderly account for you, most excellent Theophilus, so that you may know the truth concerning the things about which you have been instructed."
