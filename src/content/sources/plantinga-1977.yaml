edition: "Grand Rapids: William B. Eerdmans, 1977"
location: "Part I, \"Natural Atheology\": chapter 4 \"The Free Will Defense\", pp. 29–58"
original_quote: "A world containing creatures who are significantly free (and freely perform more good than evil actions) is more valuable, all else being equal, than a world containing no free creatures at all. Now God can create free creatures, but He can't cause or determine them to do only what is right. For if He does so, then they aren't significantly free after all; they do not do what is right freely. To create creatures capable of moral good, therefore, He must create creatures capable of moral evil; and He can't give these creatures the freedom to perform evil and at the same time prevent them from doing so. As it turned out, sadly enough, some of the free creatures God created went wrong in the exercise of their freedom; this is the source of moral evil. The fact that free creatures sometimes go wrong, however, counts neither against God's omnipotence nor against His goodness; for He could have forestalled the occurrence of moral evil only by removing the possibility of moral good."
translation: "(English original)"
paraphrase: "Plantinga argues that it is possible that God, even omnipotent, could not have created a world containing moral good without also containing moral evil. He calls this the \"Free Will Defense\". It is a defense (showing possibility / logical compatibility), not a theodicy (showing God's actual reasons). The defense rests on the modal claim that there are possible worlds even an omnipotent being cannot actualize, including worlds with morally free creatures who only do what is right."
verification_status: VERIFIED
notes: "Primary text retrieved via Internet Archive PDF of the 1977 Eerdmans edition (ia601802.us.archive.org/.../Alvin%20Plantinga%20-%20God,%20Freedom,%20and%20Evil%20-Wm.%20B.%20Eerdmans%20Publishing%20Company%20(1977).pdf). Cross-checked against Wikipedia summary, the IEP \"Logical Problem of Evil\" entry, and the Ratio Christi summary. The modal argument is developed in chapter 5 (\"Was It within God's Power to Create Any Possible World He Pleased?\", pp. 34–44) and the concept of \"transworld depravity\" is introduced in chapter 7."
