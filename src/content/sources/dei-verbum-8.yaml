author: "Second Vatican Council (Dei Verbum)"
title: "Dei Verbum 8 — The growth, perpetuation, and handing on of the apostolic Tradition"
date: "1965"
source_type: church-document
language: en
edition: Official English translation (Vatican website)
location: Chapter 2, section 8
original_quote: "The apostolic preaching, which is expressed in a special way in the inspired books, was to be preserved by an unending succession of preachers until the end of time. Therefore the Apostles, handing on what they themselves had received, warn the faithful to hold fast to the traditions which they have learned either by word of mouth or by letter, and to fight in defense of the faith handed on once and for all."
translation: "(Official Vatican English translation; reproduced verbatim)"
paraphrase: "Dei Verbum 8 teaches that the Gospel was to be preserved by an unending succession of preachers, and that the apostles therefore established bishops as their successors to continue their ministry."
