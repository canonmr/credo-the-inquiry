location: Part One, Section One, Chapter One, Article 1, §36
original_quote: "His faculties make him capable of coming to a knowledge of the existence of a personal God. But for man to be able to enter into real intimacy with God, God willed both to reveal himself to him and to give him the grace of being able to welcome this revelation in faith."
translation: "(official USCCB English translation; reproduced verbatim)"
paraphrase: "Katekismus mengajar bahwa daya-daya manusia mampu mengetahui bahwa Allah pribadi itu ada, tetapi nasib keintiman yang nyata dengan Allah bergantung pada keputusan Allah untuk mewahyukan diri-Nya dan pada rahmat untuk menyambut wahyu itu dalam iman."
