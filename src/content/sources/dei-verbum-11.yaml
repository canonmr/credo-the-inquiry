source_id: dei-verbum-11
author: "Vatican Council II (Dei Verbum, Dogmatic Constitution on Divine Revelation)"
title: "Dei Verbum 11 — Inspiration and truth of Scripture"
date: "1965"
source_type: church-document
language: en
edition: Official English translation (Vatican website)
location: Chapter 3, article 11
original_quote: "Those divinely revealed realities which are contained and presented in Sacred Scripture have been written down under the inspiration of the Holy Spirit. ... since everything asserted by the inspired authors or sacred writers must be held to be asserted by the Holy Spirit, it follows that the books of Scripture must be acknowledged as teaching solidly, faithfully and without error that truth which God wanted put into sacred writings for the sake of our salvation."
translation: "(official Vatican English translation; reproduced verbatim)"
paraphrase: "Dei Verbum 11 teaches that the books of Scripture were written under the inspiration of the Holy Spirit, that God is the principal author while the human authors wrote as true authors, and that Scripture teaches 'solidly, faithfully and without error' the truth that God wanted put into the sacred writings 'for the sake of our salvation' — the latter clause defining the scope of inerrancy."
verification_status: VERIFIED
notes: "The key phrase 'without error that truth which God wanted put into sacred writings for the sake of our salvation' delimits the inerrancy of Scripture to its saving purpose. Central source for SCR-004."
