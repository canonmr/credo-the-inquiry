author: Catholic Church (Catechism of the Catholic Church, 2nd ed.)
title: "Catechism §309 — \"Providence and the scandal of evil\""
date: "1997"
source_type: church-document
language: en
edition: English translation for the United States, 1994 (2nd ed. 1997)
location: "Part One, Section Two, Chapter One, Article 1, Paragraph 4 (\"The Creator\"), §309"
original_quote: "If God the Father almighty, the Creator of the ordered and good world, cares for all his creatures, why does evil exist? To this question, as pressing as it is unavoidable and as painful as it is mysterious, no quick answer will suffice. Only Christian faith as a whole constitutes the answer to this question: the goodness of creation, the drama of sin and the patient love of God who comes to meet man by his covenants, the redemptive Incarnation of his Son, his gift of the Spirit, his gathering of the Church, the power of the sacraments and his call to a blessed life to which free creatures are invited to consent in advance, but from which, by a terrible mystery, they can also turn away in advance. There is not a single aspect of the Christian message that is not in part an answer to the question of evil."
translation: "(official USCCB English translation; reproduced verbatim)"
paraphrase: "Katekismus menyatakan bahwa masalah kejahatan tidak terhindarkan dan tidak ada jawaban cepat yang memadai. Iman Kristen secara keseluruhan — kebaikan ciptaan, drama dosa, perjanjian-perjanjian, inkarnasi, Roh, Gereja, sakramen-sakramen, dan panggilan kepada kehidupan yang berbahagia — adalah tanggapannya. Katekismus juga menyatakan bahwa 'tidak ada satu pun aspek pesan kristiani yang tidak sebagian merupakan jawaban atas pertanyaan tentang kejahatan'."
