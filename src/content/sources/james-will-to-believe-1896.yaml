edition: "James, The Will to Believe and Other Essays (1897)"
location: Lecture delivered 1896; printed 1897
original_quote: "Our passional nature not only lawfully may, but must, decide an option between propositions, whenever it is a genuine option that cannot by their nature be decided on intellectual grounds."
translation: "(James, The Will to Believe, 1896; reproduced verbatim)"
paraphrase: "James argues that when an option is live, forced, and momentous — and the intellect cannot settle it — the will may and must decide. The inquiry's end faces exactly such an option."
