original_quote: "Following Hume's lead, Paul Draper argues that, given the biological role played by both pain and pleasure in goal-directed organic systems, the observed facts about pain and pleasure in the world are antecedently much more likely on the Hypothesis of Indifference than on theism. I examine one by one Draper's arguments for this claim and show how they miss the mark."
translation: "(English original)"
paraphrase: Howard-Snyder criticizes Draper's likelihood argument by showing that theistic stories can raise P(O | theism) in ways Draper has not considered. He defends a more cautious reading of the evidential problem and supports skeptical-theism-friendly responses.
