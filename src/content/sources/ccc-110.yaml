location: Part One, Section One, Chapter Two, Article 3, §110
original_quote: "In order to reveal himself to men, God condescends to speak to them through human words, in a human way. ... For the word of God, expressed in human language, has become like to human speech in every respect, just as the Word of the eternal Father, by taking on human flesh, became like to men."
translation: "(official USCCB English translation; reproduced verbatim)"
paraphrase: "Katekismus mengajar bahwa Allah merendahkan diri untuk berbicara kepada manusia dalam kata-kata manusia: Kitab Suci sepenuhnya firman Allah dan sepenuhnya kata-kata manusia — analogi dengan inkarnasi. Kepengarangan ganda Kitab Suci meniru kodrat ganda Kristus."
verification_status: VERIFIED
notes: "CCC §110 links the doctrine of inspiration to the incarnation — the model for 'dual authorship' in SCR-003."
