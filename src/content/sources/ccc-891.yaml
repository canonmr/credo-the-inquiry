language: en
edition: English translation for the United States, 1994 (2nd ed. 1997)
location: Part One, Section One, Chapter Two, Article 3, §891
original_quote: "The Roman Pontiff, head of the college of bishops, enjoys this infallibility in virtue of his office, when, as supreme pastor and teacher of all the faithful — who confirms his brethren in the faith — he proclaims by a definitive act a doctrine pertaining to faith or morals. ... The infallibility promised to the Church is also present in the body of bishops when, together with Peter's successor, they exercise the supreme Magisterium."
translation: "(official USCCB English translation; reproduced verbatim)"
paraphrase: "Katekismus menetapkan kapan infalibilitas berlaku: pengajaran Paus ex cathedra tentang iman atau moral, dan kolegium para uskup ketika, bersama penerus Petrus, mereka menjalankan Magisterium tertinggi."
