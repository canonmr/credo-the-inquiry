title: "Catechism §314 — \"The ways of providence are often unknown to us\""
date: "1997"
source_type: church-document
language: en
edition: English translation for the United States, 1994 (2nd ed. 1997)
location: Part One, Section Two, Chapter One, Article 1, Paragraph 4, §314
original_quote: "We firmly believe that God is master of the world and of its history. But the ways of his providence are often unknown to us. Only at the end, when our partial knowledge ceases, when we see God 'face to face', will we fully know the ways by which — even through the dramas of evil and sin — God has guided his creation to that definitive sabbath rest for which he created heaven and earth."
translation: "(official USCCB English translation; reproduced verbatim)"
paraphrase: "The Catechism states that the full understanding of God's providence is not available to us in the present life. It will be known only at the eschatological vision of God \"face to face\", when partial knowledge ceases. The text does not claim that this life can resolve the problem of evil."
verification_status: VERIFIED
notes: "Note 184 cites 1 Cor 13:12. Note 185 cites Gen 2:2. This is the strongest CCC text for the project to cite when it must say \"we do not know enough to resolve the problem now\"."
