original_quote: "In its simplest form the problem is this: God is omnipotent; God is wholly good; and yet evil exists. There seems to be some contradiction between these three propositions, so that if any two of them were true the third would be false. But at the same time all three are essential parts of most theological positions: the theologian, it seems, at once must adhere and cannot consistently adhere to all three. The contradiction does not arise immediately; to show it we need some additional premises, or perhaps some quasi-logical rules connecting the terms 'good', 'evil', and 'omnipotent'. These additional principles are that good is opposed to evil, in such a way that a good thing always eliminates evil as far as it can, and that there are no limits to what an omnipotent thing can do. From these it follows that a good omnipotent thing eliminates evil completely, and then the propositions that a good omnipotent thing exists, and that evil exists, are incompatible."
translation: "(English original; the text is in English)"
paraphrase: "Mackie argues that the three propositions (God is omnipotent; God is wholly good; evil exists) form an inconsistent set once one adds two \"quasi-logical\" principles: a good thing always eliminates evil as far as it can, and an omnipotent thing has no limits to what it can do. From these, an all-good omnipotent God would eliminate all evil, contradicting the existence of evil."
