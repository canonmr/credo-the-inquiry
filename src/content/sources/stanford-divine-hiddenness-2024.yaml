original_quote: "The hiddenness argument... begins from the idea that if there is a personal God, then he is perfectly loving, and proceeds to argue that a perfectly loving God would ensure that the divine presence be adequately available to all finite persons capable of relating to God, so that nonresistant nonbelief would not occur; since nonresistant nonbelief obviously does occur, there is no perfectly loving God, and hence no God of theism."
