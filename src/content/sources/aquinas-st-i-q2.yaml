original_quote: "Whether the existence of God is self-evident? ... To know that God exists in a general and confused way is implanted in us by nature... but that God exists in the absolute sense, we cannot know by our natural reason except through his effects, since effects depend on their cause."
translation: "(Controlled paraphrase of ST I, q. 2, a. 1 and a. 2, ad 3 and obj. 3; not a verbatim quotation.)"
paraphrase: "Aquinas berargumen bahwa keberadaan Allah tidak terbukti dengan sendirinya bagi kita, bahwa ia dapat didemonstrasikan dari akibat-akibat oleh akal budi natural, dan bahwa pengetahuan akan keberadaan Allah 'dalam arti mutlak' menuntut demonstrasi dari ciptaan — tesis pengetahuan-natural yang diulang Vatikan I dan Katekismus (§36)."
