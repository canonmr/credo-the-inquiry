original_quote: "It is not certain that we can know God... God being thus hidden, every religion which does not say that God is hidden is not true; and every religion which does not give the reason for it is not instructive. Ours does all this: Vere tu es Deus absconditus."
translation: "(Controlled paraphrase of Pascal's pensée 194 (Lafuma), which quotes Isaiah 45:15 'Truly you are a hidden God.')"
