location: Chapter 2, article 7
original_quote: "In His gracious goodness, God has seen to it that what He had revealed for the salvation of all nations would abide perpetually in its full integrity and be handed on to all generations. Therefore Christ the Lord... commanded the apostles to preach... the gospel to all men. ... This was to be done not only by word... but also by written documents."
translation: "(official Vatican English translation; reproduced verbatim)"
paraphrase: "Dei Verbum 7 teaches that revelation was entrusted to the apostles and their successors, who transmit it both in oral preaching and in written documents — the foundation of the Catholic claim that Scripture and Tradition together transmit the one gospel."
