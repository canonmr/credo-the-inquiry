location: Chapter 2, section 10
original_quote: "But the task of giving an authentic interpretation of the Word of God, whether in its written form or in the form of Tradition, has been entrusted to the living teaching office of the Church alone. Its authority in this matter is exercised in the name of Jesus Christ."
translation: "(Official Vatican English translation; reproduced verbatim)"
paraphrase: "Magisterium — jabatan pengajar gereja yang hidup — mengklaim otoritas eksklusif untuk menafsirkan Sabda Allah secara otentik, baik dalam bentuk tertulis maupun dalam bentuk Tradisi. Inilah inti doktrinal otoritas interpretatif gereja."
