original_quote: "Long ago God spoke to our ancestors in many and various ways by the prophets, but in these last days he has spoken to us by a Son, whom he appointed heir of all things, through whom he also created the worlds."
translation: "(NRSV; reproduced verbatim)"
paraphrase: "Ibrani meringkas pola wahyu khusus dua tahap: dahulu Allah berbicara dengan banyak cara dan pelbagai rupa melalui para nabi, dan pada zaman akhir ini Ia berbicara melalui Sang Putra — yang oleh komunitas itu diakui sebagai pewaris segala sesuatu dan agen penciptaan."
