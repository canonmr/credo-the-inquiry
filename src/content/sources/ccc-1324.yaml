location: Catechism of the Catholic Church, 1324
original_quote: "The Eucharist is 'the source and summit of the Christian life.' The other sacraments, and indeed all ecclesiastical ministries and works of the apostolate, are bound up with the Eucharist and are oriented toward it. For in the blessed Eucharist is contained the whole spiritual good of the Church, namely Christ himself, our Pasch."
translation: "(CCC 2nd ed.; reproduced verbatim)"
