title: "CCC 1033 — Hell: definitive self-exclusion from communion"
date: "1992"
source_type: church-document
language: en
edition: "Catechism of the Catholic Church, 2nd ed. (1997)"
location: Catechism of the Catholic Church, 1033
original_quote: "To die in mortal sin without repenting and accepting God's merciful love means remaining separated from him for ever by our own free choice. This state of definitive self-exclusion from communion with God and the blessed is called 'hell.'"
translation: "(CCC 2nd ed.; reproduced verbatim)"
paraphrase: "Katekismus mendefinisikan neraka bukan sebagai tempat yang Allah kirimi orang, melainkan keadaan eksklusi-diri yang definitif dari persekutuan dengan Allah, yang dipilih secara bebas."
verification_status: VERIFIED
notes: "CCC 1033, as published on vatican.va. The definition locates the cause in human free choice, not in God's will."
