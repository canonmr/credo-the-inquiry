original_quote: "When the Son of Man comes in his glory, and all the angels with him, then he will sit on the throne of his glory. All the nations will be gathered before him, and he will separate people one from another as a shepherd separates the sheep from the goats, and he will put the sheep at his right hand and the goats at the left. ... Then the king will say to those at his right hand, 'Come, you that are blessed by my Father, inherit the kingdom prepared for you from the foundation of the world; for I was hungry and you gave me food, I was thirsty and you gave me something to drink, I was a stranger and you welcomed me, I was naked and you gave me clothing, I was sick and you took care of me, I was in prison and you visited me.' ... Then he will say to those at his left hand, 'You that are accursed, depart from me into the eternal fire prepared for the devil and his angels; for I was hungry and you gave me no food, I was thirsty and you gave me nothing to drink...'"
translation: "(NRSV; reproduced in part)"
paraphrase: "Jesus describes the final judgment as a separation of nations, decided by deeds of mercy shown to the hungry, thirsty, stranger, naked, sick, and imprisoned — the standard is the treatment of 'the least of these.'"
