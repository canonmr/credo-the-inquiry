edition: "Catechism of the Catholic Church, 2nd ed. (1997)"
location: Catechism of the Catholic Church, 1996
original_quote: "Grace is favor, the free and undeserved help that God gives us to respond to his call to become children of God, adoptive sons, partakers of the divine nature and of eternal life."
translation: "(CCC 2nd ed.; reproduced verbatim)"
paraphrase: "The Catechism defines grace as a gift, not a wage: the help to respond to God's call. The church claims every good response in the believer is itself enabled by grace."
