original_quote: "Grace is favor, the free and undeserved help that God gives us to respond to his call to become children of God, adoptive sons, partakers of the divine nature and of eternal life."
translation: "(CCC 2nd ed.; reproduced verbatim)"
paraphrase: "Katekismus mendefinisikan rahmat sebagai karunia, bukan upah: pertolongan yang bebas dan tidak layak untuk menanggapi panggilan Allah menjadi anak-anak-Nya. Gereja mengklaim bahwa setiap tanggapan baik orang beriman dimungkinkan oleh rahmat itu sendiri."
