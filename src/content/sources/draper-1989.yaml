original_quote: "Let 'O' stand for a statement reporting both the observations one has made of humans and animals experiencing pain or pleasure and the testimony one has encountered concerning the observations others have made of sentient beings experiencing pain or pleasure. Draper claims that O is antecedently much more probable on HI than on theism. Specifically, P(O | HI) >! P(O | theism)."
translation: "(English original)"
paraphrase: "Draper berargumen dengan perbandingan Bayesian/likelihood: distribusi kesakitan dan kenikmatan yang teramati di dunia biologis secara apriori jauh lebih mungkin terjadi pada 'hipotesis ketidakacuhan' (HI: tidak ada pribadi non-manusia yang berkehendak baik atau buruk terlibat) daripada pada teisme klasik. Ia berfokus pada tiga kategori: kesakitan/kenikmatan yang berguna secara biologis pada agen moral; kesakitan/kenikmatan yang berguna secara biologis pada makhluk berperasaan non-moral; dan kesakitan/kenikmatan yang tampak sia-sia secara biologis. Ketiganya, menurutnya, lebih baik diprediksi oleh ketidakacuhan daripada oleh teisme."
