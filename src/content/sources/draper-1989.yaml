original_quote: "Let 'O' stand for a statement reporting both the observations one has made of humans and animals experiencing pain or pleasure and the testimony one has encountered concerning the observations others have made of sentient beings experiencing pain or pleasure. Draper claims that O is antecedently much more probable on HI than on theism. Specifically, P(O | HI) >! P(O | theism)."
translation: "(English original)"
paraphrase: "Draper argues by a Bayesian / likelihood comparison: the observed distribution of pain and pleasure in the biological world is antecedently much more probable on the \"hypothesis of indifference\" (HI: no benevolent or malevolent non-human person is involved) than on classical theism. He focuses on three categories: biologically useful pain/pleasure in moral agents; biologically useful pain/pleasure in non-moral sentient beings; and apparently biologically gratuitous pain/pleasure. All three, he argues, are better predicted by indifference than by theism."
