location: Lumen Gentium, 16
original_quote: "Those also can attain to salvation who through no fault of their own do not know the Gospel of Christ or His Church, yet sincerely seek God and moved by grace strive by their deeds to do His will as it is known to them through the dictates of conscience."
translation: "(Vatican Council II English translation; reproduced verbatim)"
paraphrase: "Konsili mengklaim bahwa penghakiman tidak semata-mata oleh keanggotaan: mereka yang tanpa kesalahan sendiri tidak mengenal Injil atau Gereja Kristus masih dapat mencapai keselamatan jika mereka dengan tulus mencari Allah dan, digerakkan oleh rahmat, berusaha melakukan kehendak-Nya sebagaimana dikenal melalui hati nurani."
