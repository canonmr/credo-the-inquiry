edition: Proceedings of the Aristotelian Society, Supplementary Vol. 63 (1989), pp. 297–310
location: pp. 297–310
original_quote: "I want to try to capture the most pernicious of [evils] within the category of horrendous evils, which I define (for present purposes) as 'evils the participation in which (that is, the doing or suffering of which) constitutes prima facie reason to doubt whether the participant's life could (given their inclusion in it) be a great good to him/her on the whole'."
translation: (English original — original text is in English)
paraphrase: "Adams mendefinisikan 'kejahatan mengerikan' (horrendous evils) sebagai kejahatan yang partisipasi di dalamnya memberi alasan prima facie untuk meragukan apakah kehidupan peserta dapat menjadi kebaikan besar secara keseluruhan; contohnya penderitaan korban penyalahgunaan tertentu dan korban genosida. Ia lalu berargumen bahwa Allah punya kewajiban tingkat lebih tinggi: mengalahkan setiap kejahatan mengerikan, mengintegrasikannya ke dalam kehidupan peserta sebagai kebaikan besar. Ini versi 'kejahatan-mengerikan' dari teodisi kebaikan-yang-lebih-besar, berbeda dari teodisi 'pembentukan jiwa' (soul-making) yang generik."
verification_status: VERIFIED
notes: "The 1989 paper is the canonical short version. The full treatment is *Horrendous Evils and the Goodness of God* (Ithaca: Cornell University Press, 1999). The 1999 book was reviewed in *Faith and Philosophy* by Brian Davies (2001). Adams's distinctive move is to argue that \"life on the whole\" must be a great good for the participant, not merely that there is some good outweighing some evil."
