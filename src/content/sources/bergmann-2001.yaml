original_quote: "What is skeptical theism? It has two components — a skeptical component and a theistic one. The skeptical theist's theism is just the traditional monotheistic view that there exists an omniscient, omnipotent and perfectly good being. It is the skeptical theist's skepticism that..."
translation: "(English original)"
paraphrase: "Bergmann merumuskan teisme skeptis sebagai gabungan (a) teisme dan (b) skeptisisme tentang kemampuan kita melihat alasan-alasan Allah mengizinkan penderitaan. Komponen skeptis berkata kita tidak punya alasan untuk mengharapkan dapat melihat mengapa Allah mengizinkan suatu kejahatan tertentu; komponen teistis menegaskan atribut-atribut klasik. Bersama-sama mereka memblokir kesimpulan dari 'kita tidak dapat melihat alasan' ke 'tidak ada alasan'."
verification_status: VERIFIED
notes: "Cited in the Stanford Encyclopedia of Philosophy entry \"Skeptical Theism\" (plato.stanford.edu/entries/skeptical-theism/) and Bergmann's own website PDF. The label \"skeptical theism\" was coined by William Alston in a 1991 letter; Bergmann (2001) is the canonical formulation. Bergmann and Michael Rea later replied to critics in \"In Defense of Sceptical Theism: A Reply to Almeida and Oppy\" (Australasian Journal of Philosophy, 2005)."
