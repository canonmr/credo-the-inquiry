edition: "Church & Brodribb translation (public domain)"
location: Annals 15.44
original_quote: "Consequently, to get rid of the report, Nero fastened the guilt and inflicted the most exquisite tortures on a class hated for their abominations, called Christians by the populace. Christus, from whom the name had its origin, suffered the extreme penalty during the reign of Tiberius at the hands of one of our procurators, Pontius Pilatus."
translation: "(Church & Brodribb; reproduced verbatim)"
paraphrase: "Seorang sejarawan Romawi, menulis sekitar tahun 116, secara independen memberi kesaksian bahwa seorang yang bernama Christus dieksekusi di bawah Pontius Pilatus pada masa pemerintahan Tiberius — satu-satunya saksi Romawi non-Kristen abad pertama akan eksekusi itu."
verification_status: PARTIALLY VERIFIED
notes: "Controlled translation: Church & Brodribb's public-domain rendering is standard but not a critical edition. Attests the fact of execution, not the Christian claims about Christ. Written after the fact, from Roman records or hearsay."
