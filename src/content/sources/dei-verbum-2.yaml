edition: Official English translation (Vatican website)
location: Chapter 1, article 2
original_quote: "In His goodness and wisdom God chose to reveal Himself and to make known to us the hidden purpose of His will by which through Christ, the Word made flesh, man might in the Holy Spirit have access to the Father and come to share in the divine nature. Through this revelation, therefore, the invisible God, out of the abundance of His love, speaks to men as friends and lives among them, so that He may invite and take them into fellowship with Himself."
translation: "(official Vatican English translation; reproduced verbatim)"
paraphrase: "Dei Verbum 2 menyatakan tujuan wahyu: Allah, atas kebaikan dan kebijaksanaan bebas-Nya, mewahyukan maksud tersembunyi kehendak-Nya, sehingga melalui Kristus, Sang Sabda yang menjadi daging, dalam Roh Kudus, manusia dapat memperoleh akses kepada Bapa, berbagi dalam kodrat ilahi, dan diundang ke dalam persahabatan dan persekutuan dengan Allah."
