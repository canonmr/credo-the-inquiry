author: "Second Vatican Council (Lumen Gentium)"
title: "Lumen Gentium 25 — The infallibility of bishops and of the Pope"
date: "1964"
source_type: church-document
language: en
edition: Official English translation (Vatican website)
location: Chapter 3, section 25
original_quote: "In matters of faith and morals, the bishops speak in the name of Christ and the faithful are to accept their teaching and adhere to it with a religious assent. ... although the individual bishops do not enjoy the prerogative of infallibility, they nevertheless proclaim Christ's doctrine infallibly whenever, even though dispersed through the world, but still maintaining the bond of communion among themselves and with the successor of Peter, they teach in the person of Christ, and are in agreement on one position as definitively to be held."
translation: "(Official Vatican English translation; reproduced verbatim)"
paraphrase: "Lumen Gentium 25 teaches that the college of bishops, in communion with the Pope, proclaims Christ's doctrine infallibly when it agrees on a position to be held definitively."
