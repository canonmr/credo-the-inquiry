location: "Part III (\"The Necessary Evils\"), chapters 7–11"
original_quote: "I begin by arguing in Part I that, at any rate in the West in our modern world, most theists need a theodicy, an account of reasons why God might allow evil to occur. Without a theodicy, evil counts against the existence of God. I shall then argue... that the good states which (according to Christian doctrine) God seeks are so good that they outweigh the accompanying evils."
translation: "(English original)"
paraphrase: "Swinburne membela teodise Kristen yang menurutnya Allah memiliki alasan-alasan baik untuk mengizinkan kejahatan moral dan alamiah. Kejahatan moral dijelaskan oleh nilai kehendak bebas dan kesempatan bagi tanggung jawab manusia serta pembentukan karakter. Kejahatan alamiah dijelaskan oleh nilai tatanan alam yang teratur dan tunduk hukum, yang memungkinkan tindakan bebas dan perkembangan karakter moral. Kebaikan yang dikejar (keindahan, pikiran, perasaan, tindakan, ibadah, kehendak bebas) mengalahkan kejahatan yang menyertainya."
verification_status: VERIFIED
notes: "Primary text retrieved via the Internet Archive (archive.org/details/richard-swinburne-providence-and-the-problem-of-evil) and the OUP catalog page. Swinburne's theodicy is built on top of his earlier work *The Existence of God* (1979) and *Responsibility and Atonement* (1989). His four-part structure: Part I (need for theodicy), Part II (good goals), Part III (necessary evils), Part IV (God's right to permit)."
