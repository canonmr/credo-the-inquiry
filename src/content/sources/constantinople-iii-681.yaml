original_quote: "After we had laid aside all carnal affections, we had the council read the letters written by Sergius to Cyrus... and those addressed by Honorius to Sergius... and we found that these documents agreed with the doctrines of the impious sect of Apollinaris... we have decided that Honorius, who was Pope of elder Rome, shall be anathematized and cast out of the holy church of God."
