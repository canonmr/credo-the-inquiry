title: "Catechism §313 — \"In everything God works for good\""
date: "1997"
source_type: church-document
language: en
edition: English translation for the United States, 1994 (2nd ed. 1997)
location: Part One, Section Two, Chapter One, Article 1, Paragraph 4, §313
original_quote: "'We know that in everything God works for good for those who love him.' The constant witness of the saints confirms this truth: St. Catherine of Siena said to 'those who are scandalized and rebel against what happens to them': 'Everything comes from love, all is ordained for the salvation of man, God does nothing without this goal in mind.' St. Thomas More, shortly before his martyrdom, consoled his daughter: 'Nothing can come but that that God wills. And I make me very sure that whatsoever that be, seem it never so bad in sight, it shall indeed be the best.' Dame Julian of Norwich: 'Here I was taught by the grace of God that I should steadfastly keep me in the faith... and that at the same time I should take my stand on and earnestly believe in what our Lord shewed in this time — that all manner [of] thing shall be well.'"
translation: "(official USCCB English translation; reproduced verbatim)"
paraphrase: "The Catechism cites Rom 8:28 and the witness of three saints (Catherine of Siena, Thomas More, Julian of Norwich) to support the claim that \"in everything God works for good for those who love him.\" Each citation is offered as a witness to the same truth, not as a logical proof."
verification_status: VERIFIED
notes: "Note 180 cites Rom 8:28. Note 181 cites Catherine of Siena, Dialogue IV, 138 \"On Divine Providence\". Note 182 cites The Correspondence of Sir Thomas More, ed. Elizabeth F. Rogers (Princeton: Princeton University Press, 1947), letter 206, lines 661-663. Note 183 cites Julian of Norwich, The Revelations of Divine Love, tr. James Walshe SJ (London: 1961), ch. 32, 99-100. The CCC frames these as witness, not proof."
