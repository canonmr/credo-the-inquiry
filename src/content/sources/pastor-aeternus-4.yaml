location: Chapter 4 (DS 3074)
original_quote: "We teach and define that it is a dogma divinely revealed: that the Roman Pontiff, when he speaks ex cathedra, that is, when in the exercise of his office as pastor and teacher of all Christians he defines, by virtue of his supreme apostolic authority, a doctrine concerning faith or morals to be held by the whole Church, possesses, by the divine assistance promised to him in blessed Peter, that infallibility with which the divine Redeemer willed his Church to be endowed; and that such definitions of the Roman Pontiff are therefore irreformable of themselves, and not by reason of the consent of the Church."
translation: "(English translation of Pastor Aeternus, ch. 4, DS 3074; wording varies slightly across editions)"
paraphrase: "Vatikan I mendefinisikan infalibilitas kepausan: Paus mengajar secara infalibel ketika ia berbicara ex cathedra tentang iman atau moral, dan definisinya tidak dapat diubah dengan sendirinya, bukan karena persetujuan Gereja."
