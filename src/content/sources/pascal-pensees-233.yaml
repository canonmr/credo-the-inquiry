location: The wager fragment
original_quote: "You must wager. It is not optional. You are embarked. ... Let us weigh the gain and the loss in wagering that God is. ... If you gain, you gain all; if you lose, you lose nothing. Wager, then, without hesitation that He is."
translation: "(Common English rendering of Pascal's wager fragment; quoted in part)"
paraphrase: "Pascal berargumen bahwa kita tidak dapat menghindari bertaruh pada eksistensi Allah: kapal telah berlayar. Mengingat untung dan ruginya, taruhan yang rasional adalah bahwa Allah ada — meskipun ia menegaskan akal budi saja tidak dapat memutuskan persoalan itu."
