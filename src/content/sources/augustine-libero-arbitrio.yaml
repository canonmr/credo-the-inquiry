---
source_id: augustine-libero-arbitrio
author: Augustine of Hippo
title: De libero arbitrio (On Free Choice of the Will)
date: ca. 388–395
source_type: patristic
language: la
edition: CCSL 29; PL 32, 1221–1310
location: Book I; Book II 47–53; Book III 3–4, 20–21
original_quote: "[Liberum arbitrium] non est summum bonum... sed nec malum... unde nec ipsum esse, sed tendere in aliquod, et illud inordinate, malum est."
translation: "Free choice is not the supreme good, nor is it an evil; from this it follows that it is not evil simply to exist, but to tend toward something, and toward it inordinately, is evil. (provisional translation)"
paraphrase: "Dalam De libero arbitrio Agustinus berargumen bahwa (a) kejahatan moral bukan substansi melainkan privasi; (b) kehendak bebas adalah kebaikan antara dan karena itu dapat disalahgunakan; (c) Allah bukan penyebab kejahatan moral; (d) penyebab kehendak yang jahat adalah penyebab yang 'defisien', yakni keberpalingan spontan kehendak dari Allah. Ia juga membela keselarasan pengetahuan-sebelumnya ilahi dan kebebasan manusia (Buku III 3-4)."
verification_status: VERIFIED
notes: "Cross-referenced via the Stanford Encyclopedia of Philosophy entry on Augustine (plato.stanford.edu/entries/augustine/) and the original Latin and English PL/CCSL text. Augustine's anti-Manichean theodicy: by Book III, the cause of an evil will is uncaused in the efficient sense and is a deficient cause. The passage is cited by CCC §311 (note 176)."
