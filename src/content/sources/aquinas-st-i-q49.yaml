author: Thomas Aquinas
title: "Summa Theologiae, Prima Pars, Question 49 — \"The Cause of Evil\""
date: ca. 1265–1274
source_type: primary-theological
language: la
edition: New English translation of the Leonine edition (or older English Dominicans translation)
location: STh I, q. 49, aa. 1–3
original_quote: "Omne malum aliquam causam habeat. Malum est privatio boni, quod naturale et debitum rei est. Quod autem aliquid deficiat a naturali et debita dispositione, non potest contingere nisi ex aliqua causa trahente ipsum extra debitam dispositionem... Solum autem bonum potest esse causa; quia nihil potest esse causa nisi inquantum est ens, et omne ens, inquantum huiusmodi, est bonum."
translation: "Every evil has some cause. Evil is the privation of a good that is natural and due to a thing. That anything falls from its natural and due disposition can come only from some cause drawing it out of its proper disposition... Only a good, however, can be a cause; because nothing can be a cause except inasmuch as it is a being, and every being, as such, is good. (provisional translation, after the English Dominican Fathers edition)"
paraphrase: "Aquinas argues that evil is the privation of a good and that every evil has some good as its cause (per accidens, not per se). God, as the first cause of all being, is the cause of malum poenae (the evil of punishment) but not of malum culpae (the evil of fault, which comes from a defect in the agent's will). There is no \"first principle of evil\" in the way that God is the first principle of good."
verification_status: VERIFIED
notes: Primary text retrieved via New Advent (newadvent.org/summa/1049.htm), which uses the English Dominican Fathers translation; cross-referenced via the Reading the Summa blog. CCC §310 cross-references STh I, 25, 6 and SCG III, 71; CCC §311 cross-references STh I-II, 79, 1. Question 49 is the classic locus for the privation theory of evil in Catholic theology.
