original_quote: "For I handed on to you as of first importance what I in turn had received: that Christ died for our sins in accordance with the scriptures, and that he was buried, and that he was raised on the third day in accordance with the scriptures, and that he appeared to Cephas, then to the twelve. Then he appeared to more than five hundred brothers and sisters at one time, most of whom are still alive, though some have died. Then he appeared to James, then to all the apostles. Last of all, as to one untimely born, he appeared also to me."
translation: "(NRSV; reproduced verbatim)"
paraphrase: "Paulus mengutip syahadat yang diterimanya, berasal dari beberapa tahun setelah penyaliban: Kristus mati, dikuburkan, dibangkitkan, dan menampakkan diri kepada saksi-saksi — termasuk lebih dari lima ratus orang sekaligus, yang kebanyakan masih hidup ketika Paulus menulis."
