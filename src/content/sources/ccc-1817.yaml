original_quote: "Hope is the theological virtue by which we desire the kingdom of heaven and eternal life as our happiness, placing our trust in Christ's promises and relying not on our own strength, but on the help of the grace of the Holy Spirit."
translation: "(CCC 2nd ed.; reproduced verbatim)"
paraphrase: "Katekismus mendefinisikan pengharapan sebagai kebajikan mempercayai janji-janji Kristus, bukan kekuatan sendiri. Itulah sikap yang digambarkan penutup inkuiri: berharap pada apa yang tidak terlihat."
