original_quote: "It is within the power of all, therefore, in every church, who may wish to see the truth, to contemplate clearly the tradition of the apostles manifested throughout the whole world; and we are in a position to reckon up those who were by the apostles instituted bishops in the churches, and [to demonstrate] the succession of these men to our own times."
