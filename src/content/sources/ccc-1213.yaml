edition: "Catechism of the Catholic Church, 2nd ed. (1997)"
location: Catechism of the Catholic Church, 1213
original_quote: "Holy Baptism is the basis of the whole Christian life, the gateway to life in the Spirit (vitae spiritualis ianua), and the door which gives access to the other sacraments. Through Baptism we are freed from sin and reborn as sons of God; we become members of Christ, are incorporated into the Church and made sharers in her mission."
translation: "(CCC 2nd ed.; reproduced verbatim)"
paraphrase: "The Catechism states what the church claims baptism does: frees from sin, gives new birth as children of God, incorporates into Christ and the Church."
