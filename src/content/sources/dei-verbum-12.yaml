author: "Vatican Council II (Dei Verbum, Dogmatic Constitution on Divine Revelation)"
title: "Dei Verbum 12 — How Scripture is to be interpreted"
date: "1965"
source_type: church-document
language: en
edition: Official English translation (Vatican website)
location: Chapter 3, article 12
original_quote: "Since God speaks in Sacred Scripture through men in human fashion, the interpreter of Sacred Scripture, in order to see clearly what God wanted to communicate to us, should carefully investigate what meaning the sacred writers really intended, and what God wanted to manifest by means of their words. ... Scripture must be read and interpreted in the same spirit in which it was written."
translation: "(official Vatican English translation; reproduced verbatim)"
paraphrase: "Dei Verbum 12 establishes the criteria for interpreting Scripture: attend to the intention of the human authors (literary genres, historical circumstances), and read each text in the light of the whole of Scripture and of the living tradition, 'in the same Spirit in which it was written.'"
