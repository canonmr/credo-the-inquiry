location: Chapter 3, article 12
original_quote: "Since God speaks in Sacred Scripture through men in human fashion, the interpreter of Sacred Scripture, in order to see clearly what God wanted to communicate to us, should carefully investigate what meaning the sacred writers really intended, and what God wanted to manifest by means of their words. ... Scripture must be read and interpreted in the same spirit in which it was written."
translation: "(official Vatican English translation; reproduced verbatim)"
paraphrase: "Dei Verbum 12 menetapkan kriteria penafsiran Kitab Suci: perhatikan maksud yang sungguh dimaksudkan para penulis suci (genre sastra, keadaan historis), dan baca setiap teks dalam terang seluruh Kitab Suci dan tradisi yang hidup, 'dalam Roh yang sama yang dengannya Kitab Suci ditulis.'"
