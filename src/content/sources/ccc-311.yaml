title: "Catechism §311 — \"Moral evil and the freedom of creatures\""
date: "1997"
source_type: church-document
language: en
edition: English translation for the United States, 1994 (2nd ed. 1997)
location: Part One, Section Two, Chapter One, Article 1, Paragraph 4, §311
original_quote: "Angels and men, as intelligent and free creatures, have to journey toward their ultimate destinies by their free choice and preferential love. They can therefore go astray. Indeed, they have sinned. Thus has moral evil, incommensurably more harmful than physical evil, entered the world. God is in no way, directly or indirectly, the cause of moral evil. He permits it, however, because he respects the freedom of his creatures and, mysteriously, knows how to derive good from it: For almighty God..., because he is supremely good, would never allow any evil whatsoever to exist in his works if he were not so all-powerful and good as to cause good to emerge from evil itself."
translation: "(official USCCB English translation; reproduced verbatim)"
paraphrase: "The Catechism teaches that moral evil entered the world through the free misuse of creaturely freedom, that God is not in any way the direct or indirect cause of moral evil, and that God permits it because he respects creaturely freedom and \"mysteriously\" knows how to derive good from it. The Augustine quotation (Enchiridion II, 3) is embedded: God would not allow evil to exist in his works unless he were powerful and good enough to bring good out of evil itself."
verification_status: VERIFIED
notes: "The embedded quotation is from Augustine, Enchiridion II, 3 (PL 40, 236). Notes 176 in CCC cross-reference Augustine, De libero arbitrio I, 1, 2 (PL 32, 1221-1223) and Aquinas, STh I-II, 79, 1. Note: \"He permits it... mysteriously\" — the word \"mysteriously\" is the Catechism's own and should not be flattened."
